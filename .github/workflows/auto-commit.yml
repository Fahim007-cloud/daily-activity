name: Auto Commit

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # manual run

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.log
          tail -n 60 activity.log > activity.tmp && mv activity.tmp activity.log

      - name: Commit and push
        run: |
          git config user.name "Fahim hassan"
          git config user.email "fahimhassan758@gmail.com"
          git add activity.log
          git commit -m "chore: daily activity $(date -u '+%Y-%m-%d')" || echo "Nothing to commit"
          git push
