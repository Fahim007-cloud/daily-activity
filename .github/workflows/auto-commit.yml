name: Auto Commit

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # manual run

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make daily commits
        run: |
          git config user.name "Fahim hassan"
          git config user.email "fahimhassan758@gmail.com"

          # Randomly make 3 or 4 commits today
          COUNT=$((RANDOM % 2 + 3))
          echo "Making $COUNT commits"

          for i in $(seq 1 $COUNT); do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') commit $i" >> activity.log
            tail -n 200 activity.log > activity.tmp && mv activity.tmp activity.log
            git add activity.log
            git commit -m "chore: activity $(date -u '+%Y-%m-%d') #$i"
            sleep 3
          done

          git push
